<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>체스 좌표 연습</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .dashboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #target-coord {
            font-size: 2rem;
            color: #f1c40f;
        }
        /* 체스판 설정 (CSS Grid) */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 4px solid #34495e;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .square:active {
            opacity: 0.7;
        }
        /* 체스판 색상 */
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        
        #message {
            margin-top: 20px;
            height: 24px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>체스 좌표 연습</h1>
    
    <div class="dashboard">
        <div>점수: <span id="score">0</span></div>
        <div id="target-coord">--</div>
    </div>

    <div class="board" id="board"></div>
    <div id="message"></div>

    <script>
        const boardElement = document.getElementById('board');
        const targetElement = document.getElementById('target-coord');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        
        let currentTarget = '';
        let score = 0;

        // 1. 체스판 그리기
        function createBoard() {
            ranks.forEach((rank, rankIndex) => {
                files.forEach((file, fileIndex) => {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    
                    // 짝수 인덱스 합은 밝은 칸, 홀수 인덱스 합은 어두운 칸
                    const isLight = (rankIndex + fileIndex) % 2 === 0;
                    square.classList.add(isLight ? 'light' : 'dark');
                    
                    // 칸마다 좌표 데이터 저장 (예: 'e4')
                    const coord = file + rank;
                    square.dataset.coord = coord;
                    
                    // 클릭 이벤트 추가
                    square.addEventListener('click', () => handleSquareClick(coord));
                    
                    boardElement.appendChild(square);
                });
            });
        }

        // 2. 새로운 랜덤 좌표 생성
        function nextCoordinate() {
            const randomFile = files[Math.floor(Math.random() * files.length)];
            const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
            currentTarget = randomFile + randomRank;
            targetElement.textContent = currentTarget;
            messageElement.textContent = ''; // 메시지 초기화
        }

        // 3. 칸 클릭 시 로직 처리
        function handleSquareClick(clickedCoord) {
            if (clickedCoord === currentTarget) {
                score++;
                scoreElement.textContent = score;
                messageElement.style.color = '#2ecc71';
                messageElement.textContent = '정답입니다! 🎉';
                setTimeout(nextCoordinate, 500); // 0.5초 뒤 다음 문제
            } else {
                messageElement.style.color = '#e74c3c';
                messageElement.textContent = `틀렸습니다! 거기는 ${clickedCoord}입니다.`;
                score = 0; // 틀리면 점수 초기화
                scoreElement.textContent = score;
            }
        }

        // 초기화 실행
        createBoard();
        nextCoordinate();

        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('서비스 워커가 등록되었습니다.', reg))
                    .catch(err => console.log('서비스 워커 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
