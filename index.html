<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>체스 좌표 연습</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .dashboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #target-coord {
            font-size: 2rem;
            color: #f1c40f;
        }
        
        /* 체스판 설정 */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 4px solid #34495e;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative; /* 라벨의 절대 위치 기준점이 됩니다 */
        }
        .square:active {
            opacity: 0.7;
        }
        
        /* 체스판 색상 */
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }

        /* 행/열 좌표 라벨 디자인 */
        .label-file {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .label-rank {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 라벨 색상 (칸 색상과 반전시켜서 잘 보이게) */
        .light .label-file, .light .label-rank { color: #b58863; }
        .dark .label-file, .dark .label-rank { color: #f0d9b5; }
        
        #message {
            margin-top: 20px;
            height: 24px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>체스 좌표 연습</h1>
    
    <div class="dashboard">
        <div>점수: <span id="score">0</span></div>
        <div id="target-coord">--</div>
    </div>

    <div class="board" id="board"></div>
    <div id="message"></div>

    <script>
        const boardElement = document.getElementById('board');
        const targetElement = document.getElementById('target-coord');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h']; // 열
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1']; // 행
        
        let currentTarget = '';
        let score = 0;

        // 1. 체스판 그리기 (좌표 라벨 추가)
        function createBoard() {
            ranks.forEach((rank, rankIndex) => {
                files.forEach((file, fileIndex) => {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    
                    // 칸 색상 결정
                    const isLight = (rankIndex + fileIndex) % 2 === 0;
                    square.classList.add(isLight ? 'light' : 'dark');
                    square.dataset.coord = file + rank;
                    
                    // ⭐️ [추가된 부분] 열 좌표 (a, b, c...) 표시 -> 가장 아래쪽 행(rank 1)에만 추가
                    if (rankIndex === 7) {
                        const fileLabel = document.createElement('span');
                        fileLabel.classList.add('label-file');
                        fileLabel.textContent = file;
                        square.appendChild(fileLabel);
                    }

                    // ⭐️ [추가된 부분] 행 좌표 (1, 2, 3...) 표시 -> 가장 왼쪽 열(file a)에만 추가
                    if (fileIndex === 0) {
                        const rankLabel = document.createElement('span');
                        rankLabel.classList.add('label-rank');
                        rankLabel.textContent = rank;
                        square.appendChild(rankLabel);
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(file + rank));
                    boardElement.appendChild(square);
                });
            });
        }

        // 2. 새로운 랜덤 좌표 생성
        function nextCoordinate() {
            const randomFile = files[Math.floor(Math.random() * files.length)];
            const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
            currentTarget = randomFile + randomRank;
            targetElement.textContent = currentTarget;
            messageElement.textContent = ''; 
        }

        // 3. 칸 클릭 시 로직 처리
        function handleSquareClick(clickedCoord) {
            if (clickedCoord === currentTarget) {
                score++;
                scoreElement.textContent = score;
                messageElement.style.color = '#2ecc71';
                messageElement.textContent = '정답입니다! 🎉';
                setTimeout(nextCoordinate, 500);
            } else {
                messageElement.style.color = '#e74c3c';
                messageElement.textContent = `틀렸습니다! 거기는 ${clickedCoord}입니다.`;
                score = 0; 
                scoreElement.textContent = score;
            }
        }

        createBoard();
        nextCoordinate();

        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('서비스 워커 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
